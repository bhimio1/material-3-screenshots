[package]
name = "material-3-screenshots"
version = "0.1.0"
edition = "2021"
description = "Material 3 screenshots, annotation editor and screen recorder for Hyprland"
license = "MIT"
repository = "https://github.com/bhimio1/material-3-screenshots"

[[bin]]
name = "m3-screenshots"
path = "src/main.rs"

[dependencies]
material-3-ui = { git = "https://github.com/bhimio1/material-3-ui", rev = "81c14000c29fb3cfefb0b77344b110a518bfed45", features = ["notify", "image"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "pnm"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
